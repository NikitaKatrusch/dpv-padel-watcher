name: DPV Turnier-Watcher

on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub führt das meist alle 5-15 min aus
  workflow_dispatch:         # manueller Start über den Actions-Tab

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write   # nur für die Debug-Ausgabe bei manuellen Läufen

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund --no-package-lock

      # Letzten bekannten Status wiederherstellen (jeder Lauf speichert unter neuem Schlüssel)
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Turnier prüfen
        env:
          CHROME_CHANNEL: chrome            # vorinstalliertes Chrome des Runners
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FAIL_ON_CHANGE: '1'               # Lauf wird rot -> GitHub schickt zusätzlich eine Mail
          DEBUG: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}   # manueller Lauf: immer Diagnose schreiben
        run: node watch.js --once

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      # Bei manuellem Start die Diagnose auf einen eigenen Branch legen (lesbar ohne Artifact-Download)
      - name: Debug-Ausgabe veröffentlichen
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          [ -d debug ] || exit 0
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout -q --orphan debug-output
          git rm -rf -q --cached .
          git add -f debug
          git commit -qm "Debug-Ausgabe von Lauf ${{ github.run_id }}"
          git push -f origin debug-output
